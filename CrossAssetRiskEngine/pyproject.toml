[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "pybind11>=2.12.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "cross-asset-risk-engine"
version = "0.1.0"
description = "C++ core risk engine with Python bindings for cross-asset portfolio analytics"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[tool.scikit-build]
cmake.version = ">=3.20"